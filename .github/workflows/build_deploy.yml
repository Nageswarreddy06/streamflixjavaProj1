name: Build and deploy
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: setup java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Java and Maven version
        run: |
          java -version
          mvn -version
      - name: Build with Maven
        run: mvn clean package
      - name: verify jar file
        run: |
          ls -l target/*.jar
          echo "Build and deploy workflow completed successfully."
      - name: prepare EBS package
        run: |
          mkdir -p eb-deployment
          cp target/*.jar eb-deployment/
          echo "web: java -jar *.jar" > eb-deployment/Procfile
          ls -la eb-deployment
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-deployment
          path: eb-deployment
  terraform:
    name: Terraform infrastructure
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: githublink
      - name: Test OIDC authentication
        run: |
          aws sts get-caller-identity
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        working-directory: terraform
        run: terraform init
      - name: Terraform plan
        working-directory: terraform
        run: terraform plan
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: streamflix-deployment
          path: deployment
      - name: Verify Deployment Files
        run: |
          echo "Verifying deployment Files..."
          ls -la deployment
          echo "Verify Proc File"
          cat deployment/Procfile
          test -f deployment/Procfile && echo "procfile exists."
          test -f deployment/*.jar && echo "Jar file exists."
      - name: Create Deployment ZIP file
        run: |
          cd deployment
          zip -r ../streamflixdeployment.zip .
          cd ..
          unzip -l streamflixdeployment.zip
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: githublink
      - name: Test OIDC authentication
        run: |
          aws sts get-caller-identity
      - name: Deploy sts get-caller-identity
        uses: aws-actions/elastic-beanstalk-deploy@v1
        with:
          application-name: streamflix
          environment-name: streamflix-dev
          version-label: streamflix-${{ github.run_number }}
          region: us-east-1
          deployment-package-path: streamflixdeployment.zip